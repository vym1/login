<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Hotspot</title>
<style>
  :root{
    --bg-1:#f6f1ee;
    --bg-2:#efe6e1;
    --card:#ffffff;
    --ink:#241f1d;
    --muted:#8a7f7a;
    --line:#ece3de;
    --accent:#a3272c;
    --accent-dark:#7d1d21;
    --accent-soft:#f4e0df;
    --error-bg:#fdecec;
    --error-ink:#a3272c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 600px at 15% -10%, var(--bg-2), transparent 60%),
      radial-gradient(900px 700px at 110% 110%, var(--accent-soft), transparent 55%),
      var(--bg-1);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .page{
    width:100%;
    max-width:380px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .brand{
    text-align:center;
    margin-bottom:26px;
  }
  .brand-mark{
    width:52px;height:52px;
    margin:0 auto 16px;
    border-radius:14px;
    background:linear-gradient(155deg,var(--accent),var(--accent-dark));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 24px -10px rgba(163,39,44,0.55);
  }
  .brand-mark svg{width:26px;height:26px;}
  .brand h1{
    font-size:22px;
    line-height:1.25;
    margin:0 0 6px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .brand p{
    margin:0;
    font-size:14.5px;
    color:var(--muted);
    line-height:1.5;
  }

  .card{
    width:100%;
    background:var(--card);
    border-radius:20px;
    padding:28px 26px 24px;
    box-shadow:0 20px 45px -22px rgba(36,31,29,0.28);
    border:1px solid var(--line);
  }

  .card-title{
    font-size:15px;
    font-weight:600;
    margin:0 0 18px;
    color:var(--ink);
  }

  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:7px;
  }
  .input-wrap{
    position:relative;
    display:flex;
    align-items:center;
  }
  .input-wrap input{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:11px;
    font-size:15px;
    color:var(--ink);
    background:#fbfaf9;
    outline:none;
    transition:border-color .15s ease, background .15s ease;
    font-family:inherit;
  }
  .input-wrap input:focus{
    border-color:var(--accent);
    background:#ffffff;
  }
  .input-wrap input#password{
    padding-right:44px;
  }

  .toggle-pw{
    position:absolute;
    right:6px;
    width:32px;height:32px;
    border:none;
    background:transparent;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    color:var(--muted);
  }
  .toggle-pw:hover{background:#f1ece9;color:var(--ink);}
  .toggle-pw svg{width:19px;height:19px;}
  .toggle-pw .eye-off{display:none;}
  .toggle-pw.is-visible .eye{display:none;}
  .toggle-pw.is-visible .eye-off{display:block;}

  .error-box{
    background:var(--error-bg);
    color:var(--error-ink);
    font-size:13px;
    font-weight:600;
    padding:10px 13px;
    border-radius:10px;
    margin-bottom:16px;
    line-height:1.4;
  }

  .submit-btn{
    width:100%;
    padding:13px 14px;
    border:none;
    border-radius:11px;
    background:linear-gradient(155deg,var(--accent),var(--accent-dark));
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:0.01em;
    box-shadow:0 12px 24px -12px rgba(163,39,44,0.6);
    transition:transform .12s ease, box-shadow .12s ease;
    margin-top:4px;
  }
  .submit-btn:hover{transform:translateY(-1px);}
  .submit-btn:active{transform:translateY(0);}

  .footer{
    margin-top:22px;
    text-align:center;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.01em;
  }
  .footer b{color:var(--ink);font-weight:700;}

  @media (max-width:400px){
    .card{padding:24px 20px 20px;}
    .brand h1{font-size:20px;}
  }
</style>
</head>
<body>

<div class="page">

  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 9C8.5 5 15.5 5 20 9" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M7 12.5C10 10 14 10 17 12.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M10 16C11.3 15 12.7 15 14 16" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="18.6" r="1.3" fill="white"/>
      </svg>
    </div>
    <h1>Riski Redaman Tinggi</h1>
    <p>Selamat datang di SMK PGRI Brati</p>
  </div>

  <div class="card">
    <p class="card-title">Masuk untuk melanjutkan</p>

    $(if error)
    <div class="error-box">$(error)</div>
    $(endif)

    <form name="login" action="$(link-login-only)" method="post">
      <input type="hidden" name="dst" value="$(link-orig)">
      <input type="hidden" name="popup" value="$(popup)">

      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <input type="text" name="username" id="username" placeholder="Masukkan username" autocapitalize="off" autocomplete="off" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Kata sandi</label>
        <div class="input-wrap">
          <input type="password" name="password" id="password" placeholder="Masukkan kata sandi" autocomplete="off" required>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Tampilkan kata sandi">
            <svg class="eye" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 12C4.2 7.5 8 5 12 5C16 5 19.8 7.5 22 12C19.8 16.5 16 19 12 19C8 19 4.2 16.5 2 12Z" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 3L21 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M9.9 5.2C10.6 5.06 11.3 5 12 5C16 5 19.8 7.5 22 12C21.4 13.3 20.6 14.4 19.7 15.4M6.4 6.6C4.5 7.9 3 9.7 2 12C4.2 16.5 8 19 12 19C13.2 19 14.4 18.8 15.5 18.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M9.9 14.1C9.3 13.5 9 12.7 9 12C9 10.3 10.3 9 12 9C12.7 9 13.5 9.3 14.1 9.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn">Masuk</button>
    </form>
  </div>

  <div class="footer">Powered by <b>Riski.Serkom</b></div>

</div>

<script>
  var toggle = document.getElementById('togglePw');
  var pwField = document.getElementById('password');
  toggle.addEventListener('click', function(){
    var visible = pwField.type === 'text';
    pwField.type = visible ? 'password' : 'text';
    toggle.classList.toggle('is-visible', !visible);
    toggle.setAttribute('aria-label', visible ? 'Tampilkan kata sandi' : 'Sembunyikan kata sandi');
  });
</script>

</body>
</html>
